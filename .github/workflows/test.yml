name: Verilog Testbench

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-controller:
    name: Test sprinkler_controller
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: Controller unit test
        run: |
          iverilog -g2012 -o ctrl.vvp tb/controller_tb.v rtl/sprinkler_controller.v
          vvp ctrl.vvp | tee output.txt
          grep -q "ALL TESTS PASS" output.txt

  test-sprinkler:
    name: Test full sprinkler system
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Icarus Verilog
        run: sudo apt-get update && sudo apt-get install -y iverilog

      - name: System test (controller + datapath + top)
        run: |
          iverilog -g2012 -o sim.vvp \
            tb/sprinkler_tb.v \
            rtl/sprinkler_top.v \
            rtl/sprinkler_controller.v \
            rtl/sprinkler_datapath.v \
            rtl/display.v \
            rtl/bin2bcd.v \
            rtl/hex_tdm.v \
            rtl/counter.v \
            rtl/tdm_scan.v \
            rtl/anode_decode.v \
            rtl/mux.v \
            rtl/hex_to_7seg.v
          vvp sim.vvp | tee output.txt
          grep -q "ALL TESTS PASS" output.txt
